name: Deploy to Cloud Run

# Deploy policy:
#   - push to master  → deploy BOTH live (promptly-ai-backend-git) AND dev
#                       (promptly-ai-backend-dev), plus any new Firestore
#                       composite indexes from firestore.indexes.json on both.
#   - push to any feature/* branch → deploy dev ONLY (+ dev indexes).
#
# Each Cloud Run deploy targets a specific service and does NOT pass
# env/secrets, so the service keeps its existing environment (Firestore DB,
# Razorpay keys, DEV_AUTH_PASSWORD, PUBLIC_BASE_URL, ...). Do not add
# --set-env-vars / --set-secrets here — that would override the service config.
#
# Auth: Workload Identity Federation via google-github-actions/auth. Requires two
# GitHub secrets — WIF_PROVIDER and WIF_SERVICE_ACCOUNT (one-time GCP setup in
# CI_CD_SETUP.md).
#
# Firestore indexes: applied via scripts/deploy-firestore-indexes.mjs (gcloud
# + named database), idempotent — only creates indexes missing from the target
# database.

on:
  push:
    branches:
      - master
      - 'feature/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy dev (backend + indexes)
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # Backend: deploy the dev Cloud Run service (preserves existing env/secrets).
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: promptly-ai-backend-dev
          region: us-west1
          source: .

      # Firestore: apply any new composite indexes to the dev database.
      - name: Deploy Firestore indexes (dev)
        run: node scripts/deploy-firestore-indexes.mjs --database=promptly-dev

  deploy-live:
    name: Deploy live (backend + indexes)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # Backend: deploy the live Cloud Run service (preserves existing env/secrets).
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: promptly-ai-backend-git
          region: us-west1
          source: .

      # Firestore: apply any new composite indexes to the live database.
      - name: Deploy Firestore indexes (live)
        run: node scripts/deploy-firestore-indexes.mjs --database=promptly-ai
