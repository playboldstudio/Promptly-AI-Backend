# Render blueprint — deploy this repo with one click.
#
#   Render dashboard → New → Blueprint
#   (or `render blueprint launch` if you use the Render CLI)
#
# After the service is created, set the `sync: false` secrets in the Render
# dashboard (Dashboard → your service → Environment). They're marked so they're
# never written into this file — secrets never belong in the repo.
services:
  - type: web
    name: promptly-ai-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO_ID
        sync: false
      - key: RAZORPAY_PLAN_CREATOR_ID
        sync: false
      # The live API URL — matches the Render service name the app talks to.
      - key: PUBLIC_BASE_URL
        value: https://promptly-ai-backend-svho.onrender.com
